openapi: 3.2.0
info:
  title: Triton One Solana RPC Standard API
  description: 'Triton''s enhanced Solana JSON-RPC interface. Exposes the full Solana JSON-RPC surface plus Triton''s custom extensions including getTransactionsForAddress (consolidated address history), the improved getRecentPrioritizationFees percentile-aware priority fees API, and the Whirligig WebSocket transactionSubscribe stream. All calls share the standard Solana JSON-RPC request envelope ({jsonrpc, id, method, params}).

    '
  version: '1.0'
  contact:
    name: Triton One Support
    url: https://triton.one
    email: support@triton.one
servers:
- url: https://{endpoint}.rpcpool.com
  description: Triton RPC endpoint (replace {endpoint} with your endpoint slug).
  variables:
    endpoint:
      default: mainnet-beta
security:
- TokenAuth: []
tags:
- name: Standard
  description: Standard Solana JSON-RPC methods accepted at the same endpoint.
paths:
  /:
    post:
      summary: Solana JSON-RPC Call
      description: 'Single JSON-RPC entrypoint. Set the `method` field to one of Triton''s supported methods. See operation examples for Triton''s custom methods.

        '
      operationId: callRpc
      tags:
      - Standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              getRecentPrioritizationFees:
                summary: Improved priority fees with percentile
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getRecentPrioritizationFees
                  params:
                  - []
                  - percentile: 5000
              getTransactionsForAddress:
                summary: Consolidated address history (Triton extension)
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getTransactionsForAddress
                  params:
                  - VinesnNPRzZBnTGzzybjJM1qZmxF8aQB6FA9P2J2TYP
                  - transactionDetails: full
                    sortOrder: desc
                    limit: 100
                    commitment: finalized
                    encoding: jsonParsed
                    filters:
                      slot:
                        gte: 200000000
                      status: succeeded
                      tokenAccounts: balanceChanged
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
components:
  schemas:
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
        id:
          type:
          - integer
          - string
        result: {}
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          type:
          - integer
          - string
        method:
          type: string
        params:
          type: array
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: RPC consumption token from Customers API.
